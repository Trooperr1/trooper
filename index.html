<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Shuana Coiffure - Service Privé à Domicile Neuchâtel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Raleway:wght@200;300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            -webkit-tap-highlight-color: rgba(201, 169, 97, 0.2);
            touch-action: manipulation;
        }

        :root {
            --gold: #C9A961;
            --gold-light: #E4C88A;
            --gold-dark: #9B7E3C;
            --black: #000000;
            --dark-bg: #0D0D0D;
            --dark-bg2: #1A1A1A;
            --white: #FFFFFF;
            --gray: #BDBDBD;
            --gray-dark: #6B6B6B;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--black);
            color: var(--white);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Elegant Cursor */
        * {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><circle cx="10" cy="10" r="8" fill="rgba(201,169,97,0.3)" stroke="%23C9A961" stroke-width="1"/></svg>'), auto;
        }

        a, button {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="10" fill="rgba(201,169,97,0.5)" stroke="%23C9A961" stroke-width="2"/></svg>'), pointer;
        }

        /* Loading Animation */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeOut 1.5s ease 2.5s forwards;
        }

        .loader-logo-container {
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        .loader-logo {
            font-family: 'Playfair Display', serif;
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 12px;
            position: relative;
        }

        .loader-scissors {
            position: absolute;
            top: -40px;
            right: -30px;
            font-size: 40px;
            animation: rotate 2s ease-in-out infinite;
        }

        .loader-subtitle {
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 8px;
            color: var(--gold);
            font-weight: 300;
            text-transform: uppercase;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1000;
            padding: 20px 0;
            border-bottom: 1px solid rgba(201, 169, 97, 0.15);
            transition: all 0.3s ease;
        }

        nav.scrolled {
            padding: 12px 0;
            box-shadow: 0 5px 30px rgba(201, 169, 97, 0.15);
        }

        .nav-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Luxury Logo with Icon */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            position: relative;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 6px;
            transition: all 0.3s ease;
        }

        .logo:hover {
            letter-spacing: 8px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .nav-links {
            display: flex;
            gap: 50px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--gray);
            text-decoration: none;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Language Switcher */
        .language-switcher {
            display: flex;
            gap: 15px;
            align-items: center;
            padding-left: 50px;
            border-left: 1px solid rgba(201, 169, 97, 0.2);
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(201, 169, 97, 0.3);
            color: var(--gray);
            padding: 8px 18px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-family: 'Raleway', sans-serif;
        }

        .lang-btn:hover,
        .lang-btn.active {
            background: var(--gold);
            color: var(--black);
            border-color: var(--gold);
        }

        .book-now-nav {
            padding: 12px 35px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 0;
            transition: all 0.4s ease;
            text-decoration: none;
            display: inline-block;
        }

        .book-now-nav:hover {
            background: var(--gold);
            color: var(--black);
            transform: translateY(-2px);
        }

        .book-now-nav::after {
            display: none;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
            overflow: hidden;
        }

        .hero-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 80px 0 100px;
            background: var(--black);
            position: relative;
            z-index: 2;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--gold);
            font-weight: 400;
            margin-bottom: 30px;
            text-transform: uppercase;
            animation: fadeInUp 1s ease 0.3s backwards;
        }

        .hero-badge::before {
            content: '';
            width: 40px;
            height: 1px;
            background: var(--gold);
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 92px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--white), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 1s ease 0.5s backwards;
        }

        .hero-description {
            font-size: 18px;
            color: var(--gray);
            line-height: 1.9;
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 0.5px;
            animation: fadeInUp 1s ease 0.7s backwards;
        }

        .hero-cta {
            display: flex;
            gap: 25px;
            animation: fadeInUp 1s ease 0.9s backwards;
        }

        .btn-primary {
            padding: 22px 55px;
            background: var(--gold);
            color: var(--black);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            border: 1px solid var(--gold);
            display: inline-block;
        }

        .btn-primary:hover {
            background: transparent;
            color: var(--gold);
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(201, 169, 97, 0.3);
        }

        .btn-secondary {
            padding: 22px 55px;
            background: transparent;
            color: var(--white);
            text-decoration: none;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: inline-block;
        }

        .btn-secondary:hover {
            border-color: var(--white);
            transform: translateY(-5px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hero Right - Photo Section */
        .hero-right {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--dark-bg), var(--dark-bg2));
        }

        .hero-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=800&q=80') center/cover no-repeat;
            animation: kenburns 25s ease infinite;
        }

        .hero-image-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.4), transparent);
            z-index: 1;
        }

        @keyframes kenburns {
            0%, 100% {
                transform: scale(1);
                filter: grayscale(20%);
            }
            50% {
                transform: scale(1.08);
                filter: grayscale(0%);
            }
        }

        .image-overlay {
            position: absolute;
            bottom: 80px;
            left: 80px;
            z-index: 2;
        }

        .overlay-badge {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(201, 169, 97, 0.3);
        }

        .overlay-badge-icon {
            font-size: 24px;
        }

        .overlay-badge-text {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--gold);
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Stats Section */
        .stats {
            background: var(--dark-bg);
            padding: 100px 0;
            border-top: 1px solid rgba(201, 169, 97, 0.1);
            border-bottom: 1px solid rgba(201, 169, 97, 0.1);
        }

        .stats-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 100px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 80px;
        }

        .stat-item {
            text-align: center;
            padding: 40px 20px;
            transition: transform 0.3s ease;
            position: relative;
        }

        .stat-item::after {
            content: '';
            position: absolute;
            right: -40px;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 60px;
            background: rgba(201, 169, 97, 0.2);
        }

        .stat-item:last-child::after {
            display: none;
        }

        .stat-item:hover {
            transform: translateY(-10px);
        }

        .stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 64px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 15px;
            line-height: 1;
        }

        .stat-label {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--gray);
            text-transform: uppercase;
            font-weight: 400;
        }

        /* About Section */
        .about-section {
            padding: 180px 0;
            background: var(--black);
            position: relative;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 120px;
            align-items: center;
        }

        .about-left {
            position: relative;
        }

        .about-image-container {
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(201, 169, 97, 0.2);
            aspect-ratio: 3/4;
        }

        .about-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(30%) contrast(1.1);
            transition: all 0.7s ease;
        }

        .about-image-container:hover img {
            filter: grayscale(0%) contrast(1);
            transform: scale(1.05);
        }

        .about-image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .about-badge {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 15px 30px;
            background: rgba(201, 169, 97, 0.9);
            color: var(--black);
        }

        .about-badge-icon {
            font-size: 24px;
        }

        .about-badge-text {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .about-right {
            padding-left: 20px;
        }

        .about-content {
            display: none;
        }

        .about-content.active {
            display: block;
        }

        .about-text {
            font-size: 17px;
            line-height: 1.9;
            color: var(--gray);
            margin-bottom: 25px;
            font-weight: 300;
        }

        .about-text strong {
            color: var(--gold);
            font-weight: 600;
        }

        .credentials {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin: 50px 0;
        }

        .credential-item {
            display: flex;
            gap: 20px;
            padding: 30px;
            background: var(--dark-bg);
            border: 1px solid rgba(201, 169, 97, 0.1);
            transition: all 0.3s ease;
        }

        .credential-item:hover {
            border-color: rgba(201, 169, 97, 0.4);
            transform: translateX(10px);
            background: var(--dark-bg2);
        }

        .credential-icon {
            font-size: 32px;
            line-height: 1;
        }

        .credential-content h4 {
            font-size: 16px;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .credential-content p {
            font-size: 13px;
            color: var(--gray);
            line-height: 1.6;
            font-weight: 300;
        }

        .about-quote {
            margin-top: 50px;
            padding: 40px;
            background: linear-gradient(135deg, var(--dark-bg), var(--dark-bg2));
            border-left: 3px solid var(--gold);
            position: relative;
        }

        .about-quote::before {
            content: '"';
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 80px;
            color: var(--gold);
            opacity: 0.2;
            font-family: 'Playfair Display', serif;
            line-height: 1;
        }

        .about-quote p {
            font-size: 18px;
            font-style: italic;
            color: var(--white);
            line-height: 1.8;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .quote-author {
            display: block;
            font-size: 14px;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Services Section */
        .services {
            padding: 180px 0;
            background: var(--dark-bg);
            position: relative;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 100px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 100px;
        }

        .section-badge {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--gold);
            font-weight: 400;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .section-badge::before,
        .section-badge::after {
            content: '';
            width: 30px;
            height: 1px;
            background: var(--gold);
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 82px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--white), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .section-description {
            font-size: 16px;
            color: var(--gray);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.8;
            font-weight: 300;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: rgba(201, 169, 97, 0.1);
        }

        .service-card {
            background: var(--dark-bg);
            padding: 60px 50px;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 169, 97, 0.05), transparent);
            transition: left 0.7s ease;
        }

        .service-card:hover::before {
            left: 100%;
        }

        .service-card:hover {
            background: var(--dark-bg2);
            transform: translateY(-10px);
            border-color: rgba(201, 169, 97, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .service-icon {
            font-size: 42px;
            margin-bottom: 25px;
            display: block;
        }

        .service-name {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--white);
            letter-spacing: 1px;
        }

        .service-price {
            font-size: 36px;
            font-weight: 700;
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            margin-top: 25px;
        }

        .service-divider {
            width: 50px;
            height: 1px;
            background: rgba(201, 169, 97, 0.3);
            margin: 20px 0;
        }

        /* VIP Home Service Info Section */
        .vip-info-section {
            padding: 100px 0;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            position: relative;
            overflow: hidden;
        }

        .vip-info-section::before {
            content: '🏠';
            position: absolute;
            top: 50%;
            right: -100px;
            font-size: 400px;
            opacity: 0.05;
            transform: translateY(-50%);
        }

        .vip-info-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 80px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .vip-badge {
            display: inline-block;
            padding: 10px 25px;
            background: var(--black);
            color: var(--gold);
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .vip-title {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            font-weight: 700;
            color: var(--black);
            line-height: 1.2;
        }

        .vip-description {
            font-size: 17px;
            line-height: 1.9;
            color: rgba(0, 0, 0, 0.8);
            margin-bottom: 35px;
        }

        .vip-benefits {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            margin-bottom: 35px;
        }

        .vip-benefit {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
            color: var(--black);
            letter-spacing: 1px;
        }

        .vip-benefit span:first-child {
            font-size: 20px;
        }

        .vip-cta-btn {
            display: inline-block;
            padding: 18px 45px;
            background: var(--black);
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .vip-cta-btn:hover {
            background: var(--dark-bg2);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Gallery Section */
        .gallery {
            padding: 180px 0;
            background: var(--dark-bg);
            position: relative;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            margin-top: 100px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 3/4;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(201, 169, 97, 0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
            filter: grayscale(40%) contrast(1.1);
        }

        .gallery-item:hover img {
            transform: scale(1.15);
            filter: grayscale(0%) contrast(1);
        }

        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 40px;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-text {
            color: var(--white);
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;

        .gallery-subtext {
            color: var(--gold);
            font-size: 12px;
            letter-spacing: 2px;

        /* WhatsApp Floating Button */
        .whatsapp-float {
            position: fixed;
            bottom: 120px;
            right: 40px;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.5);
            z-index: 999;
            transition: all 0.3s ease;
            animation: pulse-whatsapp 2.5s infinite;
        }

        .whatsapp-float:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 12px 40px rgba(37, 211, 102, 0.7);

            0%, 100% {

            }
            50% {

            background: var(--black);

            margin-top: 80px;
            height: 600px;
            border: 2px solid rgba(201, 169, 97, 0.2);
            overflow: hidden;
            position: relative;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            filter: grayscale(100%) invert(94%) contrast(90%);
        }

        .map-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            margin-top: 2px;
            background: rgba(201, 169, 97, 0.1);
        }

        .map-info-item {
            background: var(--dark-bg);
            padding: 50px 40px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid transparent;

        .map-info-item:hover {
            background: var(--black);
            border-color: rgba(201, 169, 97, 0.3);
            transform: translateY(-5px);
        }

        .map-info-icon {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .map-info-title {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .map-info-detail {
            color: var(--gray);
            font-size: 14px;
            line-height: 1.8;
            font-weight: 300;
        }

        /* Booking Section */
        .booking {
            padding: 180px 0;
            background: var(--dark-bg);
            position: relative;
        }

        .booking::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .booking-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 120px;
            align-items: start;
        }

        .booking-info {
            padding-right: 50px;
        }

        /* Deposit Requirement Top Notice */
        .deposit-requirement-top {
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(201, 169, 97, 0.15), rgba(201, 169, 97, 0.05));

            border-left: 8px solid var(--gold);
            display: flex;
            gap: 20px;
            align-items: flex-start;

        .deposit-req-icon {
            font-size: 40px;
            line-height: 1;
            animation: pulse-deposit 2s infinite;
        }

        @keyframes pulse-deposit {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .deposit-req-content {
            flex: 1;
        }

        .deposit-req-title {
            font-size: 18px;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;

        .deposit-req-text {
            font-size: 15px;
            color: var(--white);
            line-height: 1.8;
            font-weight: 400;
        }

        .booking-info {
            position: sticky;
            top: 120px;
        }

        .payment-methods {
            margin-top: 60px;
        }

        .payment-title {
            font-size: 14px;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 30px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .payment-badges {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .payment-badge {
            background: rgba(201, 169, 97, 0.05);
            border: 1px solid rgba(201, 169, 97, 0.2);
            padding: 20px 30px;
            font-size: 14px;
            color: var(--gold);
            letter-spacing: 2px;
            font-weight: 400;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .payment-badge:hover {
            background: rgba(201, 169, 97, 0.1);
            border-color: var(--gold);
            transform: translateX(10px);
        }

        /* Deposit Notice */
        .deposit-notice {
            margin-top: 40px;
            padding: 30px;
            background: rgba(201, 169, 97, 0.05);
            border: 2px solid var(--gold);
            border-left: 5px solid var(--gold);
            display: flex;
            gap: 20px;
        }

        .deposit-icon {
            font-size: 32px;
            line-height: 1;
        }

        .deposit-content {
            flex: 1;
        }

        .deposit-title {
            font-size: 16px;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .deposit-text {
            font-size: 14px;
            color: var(--gray);
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .deposit-methods {
            background: var(--black);
            padding: 20px;
            border-radius: 5px;
        }

        .deposit-method-title {
            font-size: 13px;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 1px;

        .deposit-method-item {

            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(201, 169, 97, 0.1);
            font-size: 14px;
            color: var(--gray);

        .deposit-method-item strong {
            color: var(--white);
            font-weight: 600;
        }

        .booking-form {
            background: var(--black);
            padding: 80px 70px;
            border: 1px solid rgba(201, 169, 97, 0.15);
        }

        .form-group {
            margin-bottom: 40px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 18px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--white);
            font-size: 16px;
            font-family: 'Raleway', sans-serif;
            font-weight: 300;
            transition: all 0.3s ease;
        }

        .form-group select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C9A961' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");

            background-position: right 0 center;
            background-size: 24px;
            padding-right: 30px;
        }

        .form-group select option {
            background: var(--dark-bg);
            color: var(--white);
            padding: 15px;
            font-size: 15px;
        }

        .form-group select option:hover,
        .form-group select option:checked {
            background: var(--gold);
            color: var(--black);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-bottom-color: var(--gold);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px;
        }

        /* Deposit Confirmation Field */
        .deposit-confirmation-group {
            background: rgba(201, 169, 97, 0.05);
            border: 2px solid var(--gold);
            padding: 25px;
            border-radius: 5px;
            margin: 30px 0;
        }

        .deposit-confirmation-label {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            cursor: pointer;
            font-size: 16px;
            color: var(--white);
            font-weight: 500;
        }

        .deposit-confirmation-label input[type="checkbox"] {
            width: 24px;
            height: 24px;
            min-width: 24px;
            cursor: pointer;
            accent-color: var(--gold);
            margin-top: 2px;
        }

        .deposit-confirm-text {
            line-height: 1.6;
        }

        .deposit-info-small {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(201, 169, 97, 0.2);
            font-size: 13px;
            color: var(--gray);
            font-style: italic;
        }

        .submit-button {
            width: 100%;
            padding: 25px;
            background: var(--gold);
            color: var(--black);
            border: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            margin-top: 20px;
            font-family: 'Raleway', sans-serif;
        }

        .submit-button:hover {
            background: var(--gold-light);
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(201, 169, 97, 0.4);
        }

        .success-message {
            display: none;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--black);
            padding: 25px;
            margin-bottom: 40px;
            font-weight: 500;
            text-align: center;
            letter-spacing: 1px;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Contact Section */
        .contact {
            padding: 180px 0;
            background: var(--black);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            margin-top: 100px;
            background: rgba(201, 169, 97, 0.1);
        }

        .contact-item {
            text-align: center;
            padding: 80px 50px;
            background: var(--dark-bg);
            border: 1px solid transparent;
            transition: all 0.4s ease;
        }

        .contact-item:hover {
            border-color: rgba(201, 169, 97, 0.4);
            transform: translateY(-10px);
            background: var(--black);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .contact-icon {
            font-size: 48px;
            margin-bottom: 30px;
        }

        .contact-title {
            font-size: 14px;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .contact-detail {
            font-size: 16px;
            color: var(--gray);
            line-height: 1.9;
            font-weight: 300;
        }

        /* Footer */
        footer {
            background: var(--dark-bg);
            padding: 80px 0 40px;
            text-align: center;
            border-top: 1px solid rgba(201, 169, 97, 0.1);
        }

        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 8px;
            margin-bottom: 30px;
        }

        .footer-text {
            color: var(--gray-dark);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 55px;
            height: 55px;
            border: 1px solid rgba(201, 169, 97, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--gold);
            transition: all 0.3s ease;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .scroll-indicator:hover {
            border-color: var(--gold);
            background: var(--gold);
            color: var(--black);
            transform: translateY(-5px);
        }

        /* Language Content */
        .lang-content {
            display: none;
        }

        .lang-content.active {
            display: block;
        }

        @media (hover: none) and (pointer: coarse) {

            .btn-primary:hover,
            .btn-secondary:hover,
            .service-card:hover,
            .contact-item:hover {
                transform: none;
            }

            /* Add active/touch states instead */
            .btn-primary:active {

    <script>
        // Navigation scroll effect
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 100) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Language system
        let currentLang = 'fr';
        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                }
            });
        }
    </script>
